services:
  postgres:
    image: pgvector/pgvector:pg15
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: cslate
      POSTGRES_PASSWORD: cslate
      POSTGRES_DB: cslate_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cslate"]
      interval: 2s
      timeout: 5s
      retries: 15

  cslate-server:
    build:
      context: ${CSLATE_SERVER_PATH:-../CSlate-server}
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://cslate:cslate@postgres:5432/cslate_dev
      NODE_ENV: development
    volumes:
      - ${CSLATE_SERVER_PATH:-../CSlate-server}/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
